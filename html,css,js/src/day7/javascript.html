// javascript is called interpreted language bcz it is  not compiled into machine code. it is executed line by line by the browser. it is executed at runtime. it is not converted into machine code.                  
// HTML: structure of webpage
// CSS: styles webpage
// javascript:  interacts with the user

/* features of javascript:
1. Supports all browser: multiplatform language
2. DOM: document object model: it hepls manipulate the html elements od webpafe.
3. Main feature is Eventhandling: to make the webpages interactive
4. Suppors OOPs.
5. provides built-in methods.
 */ 

/*
1.body tag
2.head tag
3.external JS file */
 -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Document</title>
    <!-- JavaScript code inside head tag-->
    <script type="text/javascript">
      function myFunction() {
        alert("Hello World!!");
      }
    </script>
  </head>
  <body>
    <input type="button" value="Click me" onclick="myFunction()" />
    <!-- javascript code inside body tag -->
    <script type="text/javascript">
      alert("Hello World");
    </script>
  </body>
</html>
