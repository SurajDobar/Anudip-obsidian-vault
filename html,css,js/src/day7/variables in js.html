<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- /* 4 types of variable declaration in JavaScript
1. var
2. let
3. const
4. auto-variable declaration 
 */ -->

    <script>
      // var variable declaration
      var a = 10;
      alert(a);
      // let variable declaration
      let b = 20;
      alert(b);
      // const variable declaration
      const c = 30;
      alert(c);
      // auto-variable declaration
      d = 40;
      alert(d);
    </script>
  </body>
</html>
