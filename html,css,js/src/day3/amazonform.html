<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Registration Form</title>
</head>
<body>
    <div>
        <center>
        <img src="Amazon-logo.png" alt="Amazon Logo" style=" width: 100px; height: auto;"><br></center>
    <form method="post" action="submit" style="background-color: #f3f3f3; padding: 20px; border-radius: 5px; width: 300px; margin: auto; rounded: 5px;">
        <h1>Login</h1>
        <label>Emai or phone number</label><br>
        <input type="text" name="email" placeholder="Enter your email or phone number" required><br><br>

        <label>Password</label><br>
        <input type="password" name="password" placeholder="Enter your password" required><br><br>
<button style="width:100%; background-color: #f0c14b; border: none; padding: 10px; border-radius: 5px;" type="submit">Login</button><br><br>    

<input type="checkbox" name="remember" id="remember">
        <label for="remember">Keep me signed in</label><br><br>


        <label>New to Amazon?</label><br><br>
        <button type="submit">Create your Amazon account</button>


    </form>
    </div>

    
</body>
</html>
